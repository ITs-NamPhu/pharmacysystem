# 1. Bắt tất cả luồng HTTP (cổng 80) và ép chuyển sang HTTPS
server {
    listen 80;
    server_name pharmacychainsystem.duckdns.org;
    return 301 https://$host$request_uri;
}

# 2. Xử lý luồng HTTPS (cổng 443)
server {
    listen 443 ssl;
    server_name pharmacychainsystem.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/pharmacychainsystem.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pharmacychainsystem.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50M;

    # 1. chuyển hướng React
    location / {
        proxy_pass http://react:80;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Reverse Proxy chuyển tiếp luồng dữ liệu Backend
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse Proxy chuyển tiếp luồng dữ liệu AI Agent
    location /ai/ {
        proxy_pass http://ai-agent:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}