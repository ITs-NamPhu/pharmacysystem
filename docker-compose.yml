services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pharmacy-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: pharmacy-redis

    # ports:
    #   - "6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKER_USERNAME}/pharmacysystem-api:latest

    container_name: pharmacy-api

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # ports:
    #   - "5000:8080"

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PharSystemConnection: "Server=db,1433;Database=PharmacySystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RedisConnection: redis:6379
      JwtConfig__SecretKey: ${JWT_SECRET_KEY}
      EmailSettings__AppPassword: ${GMAIL_APP_PASSWORD}
      Cors__Origins__0: "http://localhost:3000"
      Cors__Origins__1: "http://localhost:5000"
      Cors__Origins__2: "http://${EC2_HOST}:3000"
      Cors__Origins__3: "http://${EC2_HOST}:5000"

  ai-agent:
    image: ${DOCKER_USERNAME}/pharmacysystem-ai-agent:latest

    container_name: pharmacy-ai-agent

    depends_on:
      api:
        condition: service_started

    # ports:
    #   - "8000:8000"

    restart: unless-stopped

    env_file:
      - ./ai-agent/.env
    environment:
      BACKEND_URL: "http://api:8080"
      LANGFUSE_BASE_URL: "https://cloud.langfuse.com"
      LANGFUSE_TRACING_ENVIRONMENT: "production"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5000","http://${EC2_HOST}:3000","http://${EC2_HOST}:5000"]'

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  react:
    image: ${DOCKER_USERNAME}/pharmacysystem-react:latest

    container_name: pharmacy-react

    depends_on:
      - api

    # ports:
    #   - "80:80"

    restart: unless-stopped

    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_AI_URL: ${REACT_APP_AI_URL}
      WDS_SOCKET_PORT: 0

  nginx-proxy:
    image: nginx:alpine
    container_name: pharmacy-nginx
    ports:
      - "80:80"
      - "443:443" # cổng https
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt # Map chứng chỉ SSL vào Nginx
    depends_on:
      - react
      - api
      - ai-agent
    restart: unless-stopped

volumes:
  sql_data:
